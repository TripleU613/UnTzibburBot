<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Tzibbur for Telegram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2A44"/>
      <stop offset="1" stop-color="#0F1626"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5BB7FF"/>
      <stop offset="1" stop-color="#2E8CE6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- three stacked topic bubbles -->
  <rect x="44" y="60" width="140" height="38" rx="19" fill="#FFFFFF" opacity="0.92"/>
  <rect x="44" y="110" width="168" height="38" rx="19" fill="url(#ac)"/>
  <rect x="44" y="160" width="112" height="38" rx="19" fill="#FFFFFF" opacity="0.6"/>
  <!-- bubble tails -->
  <path d="M44 88 L30 104 L52 98 Z" fill="#FFFFFF" opacity="0.92"/>
  <path d="M212 138 L226 154 L204 148 Z" fill="#2E8CE6"/>
  <!-- dots on the accent bubble -->
  <circle cx="96" cy="129" r="5" fill="#FFFFFF"/>
  <circle cx="120" cy="129" r="5" fill="#FFFFFF"/>
  <circle cx="144" cy="129" r="5" fill="#FFFFFF"/>
</svg>
