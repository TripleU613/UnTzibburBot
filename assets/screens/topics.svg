    <text x="200" y="45" font-size="17" font-weight="600" fill="#FFFFFF">TzibburBot</text>
    <text x="200" y="66" font-size="13" fill="#6D8AA5">bot</text>
    <text x="20" y="86" font-size="13" fill="#6D8AA5">Topics</text>
    <!-- rows -->
    <g font-size="15">
      <g transform="translate(0,110)">
        <circle cx="42" cy="34" r="26" fill="#1FD1C4"/><text x="42" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#0B1414">F</text>
        <text x="84" y="28" font-weight="600" fill="#FFFFFF">Family</text><text x="370" y="28" text-anchor="end" font-size="12" fill="#6D8AA5">12:41</text>
        <text x="84" y="50" font-size="14" fill="#8FA5B9"><tspan fill="#FFFFFF">Miriam</tspan>  Are we still on for Sunday?</text>
        <circle cx="360" cy="48" r="10" fill="#5288C1"/><text x="360" y="52" text-anchor="middle" font-size="11" fill="#FFFFFF">3</text>
        <line x1="84" y1="70" x2="390" y2="70" stroke="#17212B"/>
      </g>
      <g transform="translate(0,182)">
