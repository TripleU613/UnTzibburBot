        <text x="84" y="28" font-weight="600" fill="#FFFFFF">Carpool</text><text x="370" y="28" text-anchor="end" font-size="12" fill="#6D8AA5">Yesterday</text>
        <text x="84" y="50" font-size="14" fill="#8FA5B9"><tspan fill="#FFFFFF">You</tspan>  Leaving in 10</text>
        <line x1="84" y1="70" x2="390" y2="70" stroke="#17212B"/>
      </g>
      <g transform="translate(0,326)">
        <circle cx="42" cy="34" r="26" fill="#3A6B6A"/><text x="42" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#0B1414">B</text>
        <text x="84" y="28" font-weight="600" fill="#FFFFFF">Block committee</text><text x="370" y="28" text-anchor="end" font-size="12" fill="#6D8AA5">Yesterday</text>
        <text x="84" y="50" font-size="14" fill="#8FA5B9"><tspan fill="#FFFFFF">Dovid</tspan>  Meeting notes are in</text>
