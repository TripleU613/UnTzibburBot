        <text x="84" y="28" font-weight="600" fill="#FFFFFF">Shul announcements</text><text x="370" y="28" text-anchor="end" font-size="12" fill="#6D8AA5">11:05</text>
        <text x="84" y="50" font-size="14" fill="#8FA5B9"><tspan fill="#FFFFFF">Gabbai</tspan>  Minyan moved to 7:15 this week</text>
        <line x1="84" y1="70" x2="390" y2="70" stroke="#17212B"/>
      </g>
      <g transform="translate(0,254)">
