<svg xmlns="http://www.w3.org/2000/svg" width="390" height="760" viewBox="0 0 390 760" font-family="-apple-system, Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs><clipPath id="r"><rect width="390" height="760" rx="44"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="390" height="760" fill="#0E1621"/>
    <rect width="390" height="96" fill="#17212B"/>
