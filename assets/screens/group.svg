      <rect x="170" y="406" width="146" height="40" rx="8" fill="#1F3448"/><text x="243" y="431">Add: admins</text>
      <rect x="16" y="452" width="146" height="40" rx="8" fill="#1F3448"/><text x="89" y="477">Mute</text>
      <rect x="170" y="452" width="146" height="40" rx="8" fill="#1F3448"/><text x="243" y="477">Leave</text>
