# Build the image on GitHub, then deploy to the production host over Tailscale SSH.
# The host address is the repository variable DEPLOY_HOST (e.g. root@100.x.y.z).
#
# Secrets: only TS_AUTHKEY (a reusable, ephemeral, preauthorized Tailscale auth key
# tagged tag:ci). Runtime secrets live in /opt/untzibburbot/.env on the host and are
# never read by this workflow. Only pushes to main deploy.
name: Deploy
on:
  push:
    branches: [main]
    # Documentation changes do not need a new image.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/security.yml'
      - '.github/workflows/automerge.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
concurrency:
  group: deploy-prod
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/tripleu613/untzibburbot
  # user@tailscale-ip of the host; set as a repository variable, never in the repo.
  HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_DIR: /opt/untzibburbot
jobs:
  build-and-deploy:
    if: github.repository == 'TripleU613/UnTzibburBot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci
          hostname: untz-deploy-${{ github.run_id }}
      - name: Ship compose files
        run: |
          set -euo pipefail
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30"
          for i in 1 2 3 4 5 6; do $SSH $HOST true && break || sleep 5; done
          scp -o StrictHostKeyChecking=no docker-compose.yml docker-compose.prod.yml $HOST:$DEPLOY_DIR/
      - name: Pull and restart
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no $HOST "set -euo pipefail
            cd $DEPLOY_DIR
            test -f .env || { echo 'missing $DEPLOY_DIR/.env'; exit 1; }
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null
            sed -i '/^IMAGE_TAG=/d' .env && echo 'IMAGE_TAG=${{ github.sha }}' >> .env
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml -p untzibburbot pull bridge
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml -p untzibburbot up -d --remove-orphans
            docker logout ghcr.io >/dev/null
            docker image prune -f >/dev/null"
      - name: Health
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no $HOST "cd $DEPLOY_DIR
            for i in \$(seq 1 36); do
              if docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml -p untzibburbot exec -T bridge curl -fsS http://127.0.0.1:8080/health 2>/dev/null; then echo; exit 0; fi
              sleep 5
            done
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml -p untzibburbot logs --tail 80 bridge
            exit 1"
