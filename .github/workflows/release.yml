# Tag vX.Y.Z → build the image with that tag and publish a GitHub release with notes.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/tripleu613/untzibburbot:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(awk -v tag="${{ github.ref_name }}" '$0 ~ "^## \\[?"tag {f=1; next} /^## /{if(f) exit} f' CHANGELOG.md)
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "${notes:-See CHANGELOG.md}" --verify-tag
